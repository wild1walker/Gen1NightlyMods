name: Nightly release

# Publishes the channel: one tag, one release, every archive on it.
#
# The whole channel shares a version, and that is the design rather than a
# convenience.  cartkit resolves a github pin by looking for the tag
# `v<version>` and, on it, an asset named exactly `<mod id>-<version>.zip`, so
# several mods can ride one release and be told apart by asset name -- which is
# what lets the cart and everything it pins go out together and stay
# self-consistent.  tools/check.py fails if any manifest disagrees.
#
# Cutting one is `python3 tools/bump.py` plus a push: the next push to main
# tags v<version> if that tag does not exist yet and quietly does nothing if it
# does, so ordinary pushes are free.
#
# The tag is not pushed by a git command.  `gh release create --target <sha>`
# creates it, which sidesteps the recursion guard -- a ref created with
# GITHUB_TOKEN never triggers another workflow run.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Re-upload over an existing release for this version."
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the version, and decide whether there is anything to cut
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess, sys

          with open("nightly.json", encoding="utf-8") as fh:
              version = str(json.load(fh).get("version", ""))
          want = f"v{version}"

          forced = os.environ.get("FORCE", "").strip().lower() == "true"
          exists = subprocess.run(
              ["git", "rev-parse", "-q", "--verify", f"refs/tags/{want}"],
              capture_output=True).returncode == 0
          if not exists:
              exists = subprocess.run(
                  ["gh", "release", "view", want],
                  capture_output=True).returncode == 0

          skip = exists and not forced
          why = (f"{want} is already released; nothing to do" if skip
                 else f"nightly.json is at {version}")
          print(f"{why}.", file=sys.stderr)
          print(f"version={version}")
          print(f"tag={want}")
          print(f"skip={'true' if skip else 'false'}")
          PY

      - name: Set up Python
        if: steps.channel.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        if: steps.channel.outputs.skip != 'true'
        run: python3 -m pip install --quiet pillow

      - name: Install LuaJIT
        if: steps.channel.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit

      # The same gate checks.yml runs, repeated here so a release cannot ship a
      # cart pinned to archives nobody can rebuild.
      - name: The channel agrees with itself
        if: steps.channel.outputs.skip != 'true'
        run: python3 tools/check.py

      - name: Build every mod's archive
        if: steps.channel.outputs.skip != 'true'
        run: python3 tools/pack.py --no-pin

      - name: Fetch cartkit
        if: steps.channel.outputs.skip != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cartkit.py" \
            "https://raw.githubusercontent.com/bryanthaboi/gen1recomp/dev/tools/cartkit.py"
          python3 "$RUNNER_TEMP/cartkit.py" selftest --quiet

      - name: Pack the cart
        if: steps.channel.outputs.skip != 'true'
        env:
          CART_VERSION: ${{ steps.channel.outputs.version }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/cartkit.py" pack . \
            -o "dist/wild_green_nightly-${CART_VERSION}.g1rcart"
          (cd dist && sha256sum ./*.zip ./*.g1rcart > sha256sums.txt)
          cat dist/sha256sums.txt

      - name: Publish the release
        if: steps.channel.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.channel.outputs.tag }}
          CART_VERSION: ${{ steps.channel.outputs.version }}
        run: |
          set -euo pipefail

          prev="$(git tag -l 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)"
          range="${prev:+${prev}..}$GITHUB_SHA"
          changes="$(git log --no-merges --pretty='- %s' "$range" | head -50 || true)"

          notes=$'**This is a nightly build.** It is for testing changes before they reach the stable cart, and it can be broken in ways a release is not.'
          notes+=$'\n\nDownload `wild_green_nightly-'"${CART_VERSION}"$'.g1rcart` and open it from the game to install the cart, or install a single mod from its `.zip`.'
          notes+=$'\n\nThe nightly mods carry their own ids and conflict with their stable twins on purpose: run one or the other, never both. Your stable cart and its saves are untouched.'
          if [ -n "$changes" ]; then
            notes+=$'\n\n## Changes\n\n'"$changes"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.g1rcart dist/sha256sums.txt --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Nightly $CART_VERSION" \
              --prerelease \
              --notes "$notes" \
              dist/*.zip dist/*.g1rcart dist/sha256sums.txt
          fi

          echo "Published $TAG"

      # Now that the release exists, the pins in cart.json can be checked the
      # way a player's launcher will check them: resolved from the API, with
      # every sha256 confirmed against the file actually published.
      - name: The published pins resolve
        if: steps.channel.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/cartkit.py" validate . --online --strict

      - name: Nothing to release
        if: steps.channel.outputs.skip == 'true'
        run: |
          echo "nightly.json is at ${{ steps.channel.outputs.version }}, which is"
          echo "already released as ${{ steps.channel.outputs.tag }}."
          echo "Run python3 tools/bump.py to cut the next one."
